<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ibaco — Ice Cream</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Friendly fallback: if the module import fails, show the error on the page
      (async function(){
        try{
          if (!window.__vite_fallback_shown) {
            // nothing to do; main.jsx should have loaded
            return;
          }
        }catch(e){ /* ignore */ }
      })();
    </script>
    <script type="module">
      // Try to dynamically import the entry so we can catch errors and print them
      try {
        import('/src/main.jsx').catch(e => {
          const pre = document.createElement('pre');
          pre.style.position = 'fixed';
          pre.style.top = '120px';
          pre.style.left = '50%';
          pre.style.transform = 'translateX(-50%)';
          pre.style.background = '#ffecec';
          pre.style.color = '#900';
          pre.style.padding = '12px';
          pre.style.border = '1px solid #900';
          pre.style.borderRadius = '6px';
          pre.style.zIndex = 9999;
          pre.textContent = 'Module load error: ' + (e && e.message ? e.message : e);
          document.body.appendChild(pre);
          console.error('Module load error', e);
        });
      } catch(err) {
        const pre = document.createElement('pre');
        pre.style.position = 'fixed';
        pre.style.top = '120px';
        pre.style.left = '50%';
        pre.style.transform = 'translateX(-50%)';
        pre.style.background = '#ffecec';
        pre.style.color = '#900';
        pre.style.padding = '12px';
        pre.style.border = '1px solid #900';
        pre.style.borderRadius = '6px';
        pre.style.zIndex = 9999;
        pre.textContent = 'Dynamic import failed: ' + (err && err.message ? err.message : err);
        document.body.appendChild(pre);
        console.error(err);
      }
    </script>
  </body>
</html>
